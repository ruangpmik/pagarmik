version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pagarmik
      POSTGRES_PASSWORD: pagarmik
      POSTGRES_DB: pagarmik
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagarmik"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pagarmik:pagarmik@db:5432/pagarmik?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET}
      AI_PROVIDER: ${AI_PROVIDER:-extractive}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local-tfidf}
    ports:
      - "3000:3000"
    command: sh -c "npx prisma db push && npx tsx prisma/seed.ts && npm run start"

volumes:
  pgdata:

name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pagarmik/package-lock.json
      - working-directory: pagarmik
        run: |
          npm ci
          npx prisma generate
          npm run typecheck
          npm test
          npm run build
